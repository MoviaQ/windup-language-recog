name: tests
on:
  push:
  pull_request:
jobs:
  runtime:
    # The release must run with requirements.txt alone (numpy + ftfy, no PyTorch).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('torch') is not None)"
      - run: >-
          python -m unittest
          tests.test_release tests.test_ticket_guard tests.test_guarded_ticket_api
          tests.test_evaluate_flores tests.test_prepare_multidomain tests.test_ticket_benchmark
      - run: python language_detector.py predict "Nie mogę zalogować się do konta."
  test:
    # Whole suite. Training, export and legacy .pt code paths need PyTorch (CPU wheels).
    # The job keeps the name "test": branch protection requires "test (3.10)" and "test (3.12)".
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-training.txt
      - run: python -m unittest discover -s tests
